name: Check and release userscript
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: userscript-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const allowed = [`v${version}`, `v${version.replace(/\.0$/, '')}`];
          if (!allowed.includes(process.env.RELEASE_TAG)) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${version}; expected ${allowed.join(' or ')}`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-multi-account-userscript
          path: |
            dist/bilibili-multi-account.user.js
            dist/README.md
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bilibili-multi-account-userscript
          path: dist
      - name: Publish userscript and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/bilibili-multi-account.user.js \
            dist/README.md \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
